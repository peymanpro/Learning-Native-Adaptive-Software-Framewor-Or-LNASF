name: Publish versioned release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version matching CITATION.cff and CHANGELOG.md, without the leading v"
        required: true
        default: "0.1.2"
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: true
        default: false
        type: boolean
      release_title:
        description: "Optional custom title; leave empty to use LNASF vVERSION"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: lnasf-versioned-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Require account-owned release token
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error title=Missing RELEASE_TOKEN::Add a fine-grained token owned by the intended release author to Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out repository using the release author's token
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Validate release metadata
        id: validate
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH without a leading v."
            exit 1
          fi
          grep -Fqx "version: \"$VERSION\"" CITATION.cff || {
            echo "::error::CITATION.cff version does not match $VERSION."
            exit 1
          }
          grep -Eq "^## ${VERSION}([[:space:]]|$)" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no top-level release section for $VERSION."
            exit 1
          }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refresh and verify SHA-256 publication manifest
        id: checksums
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          files=(
            ".github/workflows/release.yml"
            "CHANGELOG.md"
            "CITATION.cff"
            "FRONTEND-STATE-AND-INTERACTION-EXAMPLES.md"
            "LICENSE-DOCUMENT.md"
            "LNASF-v0.1-Technical-Specification.pdf"
            "LNASF-v0.1.tex"
            "README.md"
            "REALTIME-COMMUNICATION-EXAMPLES.md"
            "RELEASE-PROCESS.md"
            "SPECIFICATION.md"
            "metadata/PROVENANCE.md"
            "metadata/ZENODO-METADATA.md"
            "references/REFERENCES.md"
            "references/references.bib"
          )
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Publication file is missing: $file"
              exit 1
            fi
          done
          sha256sum "${files[@]}" > metadata/SHA256SUMS.txt
          sha256sum -c metadata/SHA256SUMS.txt
          if ! git diff --quiet -- metadata/SHA256SUMS.txt; then
            git config user.name "Peyman Salimi"
            git config user.email "111855254+peymanpro@users.noreply.github.com"
            git add metadata/SHA256SUMS.txt
            git commit -m "chore: refresh SHA-256 manifest for v$VERSION"
            git push origin HEAD:main
          fi
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CUSTOM_TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { found=1 }
            found && /^## / && $0 !~ "^## " version "([[:space:]]|$)" { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "::error::Unable to extract matching release notes from CHANGELOG.md."
            exit 1
          fi
          title="$CUSTOM_TITLE"
          if [[ -z "$title" ]]; then title="LNASF v${VERSION}"; fi
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Create or resume annotated version tag
        shell: bash
        env:
          TAG: ${{ steps.validate.outputs.tag }}
          TARGET_SHA: ${{ steps.checksums.outputs.target_sha }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Release $TAG already exists; refusing to overwrite it."
              exit 1
            fi
            tagged_version="$(git show "$TAG:CITATION.cff" | sed -n 's/^version: "\(.*\)"/\1/p')"
            if [[ "$tagged_version" != "${TAG#v}" ]]; then
              echo "::error::Existing tag $TAG does not point to a matching CITATION.cff version."
              exit 1
            fi
            echo "Found matching tag without a release; continuing publication."
          else
            git config user.name "Peyman Salimi"
            git config user.email "111855254+peymanpro@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "$RELEASE_TITLE"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          TAG: ${{ steps.validate.outputs.tag }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          args=( "$TAG" --verify-tag --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=( --prerelease )
          fi
          gh release create "${args[@]}"
